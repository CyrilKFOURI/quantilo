name: Browser version

# Checks that the browser-only version builds (Python runs in the page through Pyodide, no server:
# frontend/src/lite, lite/). It is published on Vercel only (quantilo-app.vercel.app), one link.
on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "lite/**"
      - "backend/app/**"
      - "packages/quantilo/src/**"
      - "samples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build:lite
        working-directory: frontend
