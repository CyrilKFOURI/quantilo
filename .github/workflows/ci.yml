name: CI

# Actions minutes are counted on this private repo: docs-only pushes and the bot's
# backend/static commits skip CI, and a newer push cancels the run still going.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "backend/static/**"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "backend/static/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Dependabot's pull requests wait for the owner (dependencies are approved by hand): no CI
    # minutes on each of their automatic rebases.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra deep --extra agent  # CPU PyTorch on Linux: the deep models are tested too; the agent's SDK
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Tests (performance checks on millions of rows excluded)
        run: uv run pytest

  library:
    # The engine alone, as a notebook user installs it: no FastAPI, no app.
    if: github.actor != 'dependabot[bot]'  # see backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quantilo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra ml --extra deep --extra plot  # CPU PyTorch on Linux
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
        env:
          NODE_OPTIONS: --max-old-space-size=6144  # pyright on the whole engine passed 2 GB
      - name: Tests
        run: uv run pytest
      - name: Builds a wheel
        run: uv build --wheel --out-dir dist && ls dist

  frontend:
    # Dependabot's pull requests wait for the owner (dependencies are approved by hand): no CI
    # minutes on each of their automatic rebases.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, library, frontend]
    # The image is checked on master only, not on every pull request.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t quantilo:ci .
      - name: Image size under 900 MB
        run: |
          size=$(docker image inspect quantilo:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((900 * 1024 * 1024))
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 quantilo:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/v1/health | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          curl -fs http://localhost:8000/api/v1/health | grep -q '"status":"ok"'
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          curl -fs http://localhost:8000/api/v1/samples | grep -q typing_traps
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
