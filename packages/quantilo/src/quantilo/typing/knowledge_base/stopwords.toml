# Stop words: the grammatical words of each language (articles, pronouns, prepositions,
# conjunctions, common auxiliaries), written for this project. Compared lowercased.
#
# Elisions keep their apostrophe ("l'", "qu'"): a lone "t" ("T-LIGHT") is not French.
# Used to tell sentences from labels (a share of stop words) and to find a text's language
# (the language whose stop words it holds most). Words shared by several languages ("de", "a",
# "in") are fine: a tie gives no language. They are also left out at both ends of the frequent
# expressions shown on the variable page.
#
# `id`: ISO 639-1 code; `label`: shown in the interface.

[[language]]
id = "en"
label = "English"
words = [
  "a", "about", "after", "again", "all", "also", "am", "an", "and", "any", "are", "as", "at",
  "be", "because", "been", "before", "being", "both", "but", "by", "can", "could", "did", "do",
  "does", "doing", "don", "down", "during", "each", "even", "few", "for", "from", "further",
  "had", "has", "have", "having", "he", "her", "here", "hers", "herself", "him", "himself",
  "his", "how", "i", "if", "in", "into", "is", "isn", "it", "its", "itself", "just", "me",
  "more", "most", "my", "myself", "no", "nor", "not", "now", "of", "off", "on", "once", "only",
  "or", "other", "our", "ours", "ourselves", "out", "over", "own", "same", "she", "should", "so",
  "some", "such", "than", "that", "the", "their", "theirs", "them", "themselves", "then",
