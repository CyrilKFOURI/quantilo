# Semantic roles recognized from column names (FR + EN).
# `names`: words or word sequences, matched against the normalized column name
#          ("customerAge", "customer_age", "Customer Age" → customer age).
# `type`:  analysis type the role forces when the values allow it (optional).
# `min`/`max`: plausible numeric range; outside it, the role is not applied.
# `label`: shown in the interface.

[[role]]
id = "identifier"
label = "Identifier"
names = ["id", "uuid", "guid", "identifier", "identifiant", "ref", "reference", "matricule",
         "siret", "siren", "sku", "ean", "isbn"]
type = "identifier"

[[role]]
id = "age"
label = "Age"
names = ["age", "ages", "years old", "age years"]
type = "numeric_continuous"
min = 0
max = 130

[[role]]
id = "amount"
label = "Amount"
names = ["price", "prix", "amount", "montant", "revenue", "revenu", "income",
         "salary", "salaire", "sales", "turnover", "eur", "euro", "euros", "usd", "dollar", "dollars",
         "total", "fee", "fees", "spend", "spending", "profit", "margin", "marge", "wage"]
type = "numeric_continuous"

[[role]]
id = "percentage"
label = "Percentage"
names = ["pct", "percent", "percentage", "pourcentage", "rate", "taux", "ratio", "share", "discount",
         "remise", "part"]

[[role]]
id = "quantity"
label = "Quantity"
names = ["qty", "quantity", "quantite", "quantité", "nb", "nbr", "nombre", "count", "units", "unit",
         "number of"]

[[role]]
id = "rating"
label = "Rating"
names = ["rating", "score", "satisfaction", "stars", "grade", "nps", "evaluation", "évaluation"]

[[role]]
id = "duration"
label = "Duration"
names = ["duration", "duree", "durée", "seconds", "minutes", "hours", "delay", "delai", "délai",
         "elapsed", "tenure", "anciennete", "ancienneté"]

[[role]]
id = "year"
label = "Year"
names = ["year", "years", "annee", "année", "yr", "birth year", "annee naissance", "millesime"]
type = "datetime"
min = 1800
max = 2100

[[role]]
id = "month"
label = "Month"
names = ["month", "mois"]

[[role]]
id = "weekday"
label = "Day of week"
names = ["weekday", "day of week", "jour semaine", "dow"]

[[role]]
id = "latitude"
label = "Latitude"
names = ["lat", "latitude"]
type = "numeric_continuous"
min = -90
max = 90

[[role]]
id = "longitude"
label = "Longitude"
names = ["lon", "lng", "long", "longitude"]
type = "numeric_continuous"
min = -180
max = 180

[[role]]
id = "country"
label = "Country"
names = ["country", "pays", "nation", "country code", "code pays"]
type = "categorical_nominal"

[[role]]
id = "city"
label = "City"
names = ["city", "ville", "town", "commune", "municipality"]
type = "categorical_nominal"

[[role]]
id = "region"
label = "Region"
names = ["region", "région", "state", "province", "department", "departement", "département", "county"]
type = "categorical_nominal"

[[role]]
id = "entity"
label = "Entity code"
# numbered places a dataset is split by (Walmart's "Store" 1-45, 040): categories, not amounts
names = ["store", "shop", "branch", "agency", "agence", "magasin", "boutique", "warehouse",
         "entrepot", "entrepôt", "depot", "dépôt", "plant", "usine", "station", "outlet"]
type = "categorical_nominal"

[[role]]
id = "postal_code"
label = "Postal code"
names = ["zip", "zipcode", "zip code", "postcode", "postal code", "code postal", "cp", "postal"]
type = "categorical_nominal"

[[role]]
id = "email"
label = "Email"
names = ["email", "mail", "e mail", "courriel", "email address"]
pattern = "email"

[[role]]
id = "phone"
label = "Phone"
names = ["phone", "telephone", "téléphone", "tel", "mobile", "portable", "gsm", "fax"]
type = "categorical_nominal"
pattern = "phone"

[[role]]
id = "url"
label = "URL"
names = ["url", "link", "website", "site", "lien", "href", "uri"]
pattern = "url"

[[role]]
id = "gender"
label = "Gender"
names = ["gender", "sex", "sexe", "genre", "civilite", "civilité"]
type = "categorical_nominal"

[[role]]
id = "status"
label = "Status"
names = ["status", "statut", "etat", "état", "stage", "phase"]
type = "categorical_nominal"

[[role]]
id = "free_text"
label = "Free text"
names = ["comment", "comments", "commentaire", "commentaires", "description", "desc", "notes",
         "remark", "remarks", "remarque", "feedback", "message", "review", "avis", "summary",
         "resume", "résumé", "body", "content", "text", "texte"]
type = "text"

# --- 048: business keys and measures (spec 048, P2) ----------------------------------------------
# `key = true`: detected like an identifier (unique → identifier, repeated → categories), and the
# role only applies when its word is the whole column name, alone or with one of `suffixes` before
# or after it ("Customer ID", "order_no", "InvoiceNo", "id_client"): "InvoiceDate" is no key.

[[role]]
id = "customer_key"
label = "Customer key"
names = ["customer", "customers", "client", "clients", "user", "users", "account", "member",
         "patient", "subscriber", "buyer", "shopper", "cust"]
suffixes = ["id", "ids", "no", "nr", "num", "number", "numero", "code", "key", "ref", "reference",
            "identifier", "uuid", "guid"]
key = true

[[role]]
id = "order_key"
label = "Order key"
names = ["order", "invoice", "transaction", "basket", "cart", "receipt", "commande", "facture"]
suffixes = ["id", "ids", "no", "nr", "num", "number", "numero", "code", "key", "ref", "reference",
            "identifier", "uuid", "guid"]
key = true

[[role]]
id = "cost"
label = "Cost"
names = ["cost", "costs", "cout", "couts", "coût", "coûts", "cogs", "expense", "expenses", "charge",
         "charges", "depense", "dépense", "depenses", "dépenses"]
type = "numeric_continuous"

[[role]]
id = "target"
label = "Target"
# no forced type: a machine-learning "target" column keeps the type its values give
names = ["target", "targets", "budget", "forecast", "quota", "goal", "objective", "objectif",
         "objectifs"]

[[role]]
id = "unit_price"
label = "Unit price"
names = ["unit price", "unitprice", "price per unit", "unit cost", "cost per unit", "price each",
         "prix unitaire", "tarif", "tarif unitaire"]
type = "numeric_continuous"

[[role]]
id = "currency"
label = "Currency"
names = ["currency", "currencies", "currency code", "ccy", "devise", "monnaie"]
type = "categorical_nominal"

[[role]]
id = "label"
label = "Short text"
# short texts that name things (050): product names, titles. No forced type: the values decide.
names = ["label", "labels", "libelle", "libellé", "title", "titre", "product name", "item name",
         "product title", "designation", "désignation", "headline", "subject", "objet", "intitule",
         "intitulé"]

[[role]]
id = "address"
label = "Address"
names = ["address", "addresses", "adresse", "addr", "street", "street address", "address line",
         "adresse postale", "rue", "direccion", "dirección", "indirizzo", "anschrift", "strasse",
         "straße"]

[[role]]
id = "hour"
label = "Hour of day"
# a number that goes round (063, R-DATE-04): 23 h is next to 0 h. "hours" is a duration.
names = ["hour", "heure", "hr", "hour of day", "heure du jour"]
min = 0
max = 23

[[role]]
id = "angle"
label = "Angle"
# a direction in degrees (063, R-DATE-04): 350 is next to 10.
names = ["angle", "bearing", "heading", "azimuth", "azimut", "wind direction", "wind dir",
         "direction du vent"]
min = 0
max = 360

# --- 055: logged decisions (spec 055, R-PO1) ------------------------------------------------------
# The decision taken for each unit and the probability it had of being taken: together with a
# reward and covariates, they make a log of decisions that the Experiments page can evaluate.

[[role]]
id = "action"
label = "Action"
# no forced type: an action keeps the type its values give (categories, codes)
names = ["action", "actions", "treatment", "treatments", "offer", "offers", "arm", "arms",
         "campaign", "decision", "decisions", "chosen action", "action taken", "intervention"]

[[role]]
id = "propensity"
label = "Propensity"
names = ["propensity", "propensity score", "pscore", "p score", "p action", "action prob",
         "action probability", "logging prob", "logging probability", "prob", "probability"]
type = "numeric_continuous"
min = 0
max = 1

[[role]]
id = "weight"
label = "Row weight"
# how many units a row stands for (067, R-REG-SE-04: weighted least squares). Never "weight" alone:
# that is a parcel's or a person's weight, a value to explain, not a weight of the row.
names = ["sample weight", "sampling weight", "survey weight", "row weight", "obs weight",
         "observation weight", "frequency weight", "pweight", "fweight", "aweight", "wgt",
         "poids de sondage", "poids sondage", "ponderation", "pondération"]
type = "numeric_continuous"
min = 0
