# F-01 (N20, audit 2026-11-12): the numbering plans of the main French, European, North American
# and British phone numbers (ITU-T E.164), data only. `code`: the country calling code; `lengths`:
# the digits of the national significant number, after the trunk prefix; `trunk`: the prefix
# dialled inside the country before it ("" when there is none: Spain, Italy, Denmark...); `first`:
# the digits that number may start with, when the plan says so (a Norwegian number never starts
# with 0: '07-98 92 35' is no Norwegian number, whatever its length). A number
# of another country is left as it is: the `phonenumbers` library (N25, not approved) would give
# every country's plan, with its area codes and its mobile ranges.
[phones]
FR = { code = "33", lengths = [9], trunk = "0" }
BE = { code = "32", lengths = [8, 9], trunk = "0" }
CH = { code = "41", lengths = [9], trunk = "0" }
LU = { code = "352", lengths = [6, 7, 8, 9, 10, 11], trunk = "", first = "123456789" }
MC = { code = "377", lengths = [8, 9], trunk = "", first = "34689" }
DE = { code = "49", lengths = [6, 7, 8, 9, 10, 11], trunk = "0" }
AT = { code = "43", lengths = [5, 6, 7, 8, 9, 10, 11, 12, 13], trunk = "0" }
NL = { code = "31", lengths = [9], trunk = "0" }
ES = { code = "34", lengths = [9], trunk = "", first = "6789" }
PT = { code = "351", lengths = [9], trunk = "", first = "2789" }
IT = { code = "39", lengths = [6, 7, 8, 9, 10, 11], trunk = "", first = "0381" }
GB = { code = "44", lengths = [9, 10], trunk = "0" }
IE = { code = "353", lengths = [7, 8, 9], trunk = "0" }
DK = { code = "45", lengths = [8], trunk = "", first = "23456789" }
SE = { code = "46", lengths = [7, 8, 9], trunk = "0" }
NO = { code = "47", lengths = [8], trunk = "", first = "23456789" }
PL = { code = "48", lengths = [9], trunk = "", first = "123456789" }
GR = { code = "30", lengths = [10], trunk = "", first = "2689" }
US = { code = "1", lengths = [10], trunk = "1", first = "23456789" }
CA = { code = "1", lengths = [10], trunk = "1", first = "23456789" }
