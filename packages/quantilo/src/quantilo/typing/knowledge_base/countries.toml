# F-04 (N24, audit 2026-11-12): the countries and their usual writings, data only.
#
# One line per country (ISO 3166-1, and Kosovo's user-assigned XK):
#   alpha-2 = [alpha-3, English name, French name, other writings...]
# Other writings: short or official names, local names, abbreviations still in use (UK, UAE,
# EIRE). Compared lowercased, without accents, dots or apostrophes, '-', '_' and '/' read as
# spaces, '&' as 'and', a leading 'the' dropped: 'United-States', 'U.S.A.' and 'Etats-Unis' are
# found. Never here: a part of a country ('England', 'Scotland'), a country that no longer exists
# ('West Germany', 'Soviet Union', 'Yugoslavia'), a group ('World', 'European Union'): those are
# other values, never merged into a country. A writing that two countries share is left out when
# the table is read (none today: the test checks it).

