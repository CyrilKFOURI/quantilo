# Outcomes of a status column (053, P5, R-SUG-22): a categorical column with at least one value
# of `share` and one of `other` is a status, and "% {share}" is the KPI it suggests. Values are
# compared lowercased; `share` is the side a business tracks.
[[outcome]]
share = ["won", "closed won", "win"]
other = ["lost", "closed lost", "loss"]

[[outcome]]
