# Values that mean "missing", compared lowercased and trimmed.
null_tokens = ["", "na", "n/a", "nan", "null", "none", "nil", "-", "--", "?", "#n/a", "#na", "missing"]

# Street words: a value holding a number and one of these words looks like a street address
# (R-TXT-3, 050). Whole words, compared lowercased.
street_words = [
  "street", "st", "road", "rd", "avenue", "ave", "av", "boulevard", "blvd", "bd", "lane", "ln",
  "drive", "dr", "court", "ct", "place", "pl", "square", "sq", "terrace", "highway", "hwy",
  "parkway", "pkwy", "way", "close", "crescent", "row",
  "rue", "chemin", "allée", "allee", "impasse", "quai", "route", "cours", "faubourg", "sentier",
  "calle", "avenida", "plaza", "paseo", "carrera", "camino", "ronda", "travesía",
  "via", "viale", "piazza", "corso", "vicolo", "largo", "strada",
  "strasse", "straße", "str", "weg", "platz", "gasse", "ring", "damm", "ufer",
]
# Word endings of the same (German compounds: "Hauptstraße", "Lindenweg").
street_suffixes = ["strasse", "straße", "str", "weg", "platz", "allee", "gasse", "damm", "ufer"]

# Column names that say an outcome (053, R-SUG-06): a yes/no column named so is the one a KPI
# tracks ("% Churn"), before other yes/no columns. Whole words of the name, lowercased.
outcome_names = [
  "churn", "churned", "attrition", "exited", "left", "converted", "conversion", "cancelled",
  "canceled", "cancellation", "returned", "refunded", "default", "defaulted", "fraud",
  "fraudulent", "won", "win", "paid", "delivered", "resolved", "approved", "accepted",
  "subscribed", "clicked", "purchased", "retained", "active",
]

# 092 (R-TYP-04): the head word of a column name (its last word, or its first when the name holds a
# Romance function word: "Code du département") saying that whole numbers are a code, not a measure.
# `code_words` give an identifier when values are unique, categories otherwise; the short ones
# (`short_code_words`) only count in a name of at least two words ("patient_nbr", not "no").
code_words = [
  "id", "ids", "key", "code", "codes", "ref", "pid", "uid", "fips", "insee", "siren", "siret",
  "no", "nr", "nbr", "num", "numero", "number",
]
short_code_words = ["no", "nr", "nbr", "num", "numero", "number"]
category_words = [
  "district", "districts", "board", "tract", "block", "lot", "precinct", "ward", "class",
  "subclass", "category", "categorie", "type", "group", "groupe", "occupation", "profession",
  "course", "mode", "sector", "secteur", "zone", "nationality", "nationalite", "nacionalidad",
  "nacionalidade",
]
# Units and sizes: a name holding one measures ("sqft_lot" is the lot's area), never a code.
unit_words = ["sqft", "sqm", "sq", "ft", "feet", "m2", "km", "kg", "lb", "lbs", "cm", "mm", "area",
              "size", "surface", "length", "width", "height", "depth", "weight", "volume", "acres",
              "hectares", "ha"]
# Beginnings of a head word saying a category in any spelling ("Nacionality", "nazionalità").
category_stems = ["nation", "nacion", "nazional"]
function_words = ["de", "du", "des", "la", "le", "les", "d", "l", "del", "della", "di", "da", "do",
                  "dos", "das"]
# Words of a name that say a date or a time: never a code by the shape of its values (R-TYP-05).
date_words = ["date", "time", "timestamp", "ts", "epoch", "datetime", "created", "updated",
              "jour", "day", "heure"]

# fix1 (R-TYP-12, B-20): words of a name saying it holds one part of a date. A year and a month
# (and a day, an hour, a minute) whose names say the same thing otherwise ("an, mois, jour",
# "Yr Sold, Mo Sold") are the parts of one date: Clean proposes to assemble it. Whole words.
[[date_part]]
part = "year"
words = ["year", "yr", "yyyy", "annee", "an", "ano", "anio", "jahr", "anno", "jaar"]

[[date_part]]
part = "month"
words = ["month", "mo", "mon", "mm", "mois", "mes", "monat", "mese", "maand"]

[[date_part]]
part = "day"
words = ["day", "dd", "jour", "dia", "tag", "giorno", "dag"]

[[date_part]]
part = "hour"
words = ["hour", "hr", "hh", "heure", "hora", "stunde", "ora", "uur"]

[[date_part]]
part = "minute"
words = ["minute", "minutes", "mi", "mn", "minuto", "minuta"]

# C1 (fix1): one column with the time of day ("hrmn" = 07:40 in the French road-accident files)
[[date_part]]
part = "time"
words = ["hrmn", "hhmm", "hourminute", "time", "horaire", "zeit", "orario"]

# fix1 (B-21, R-SUG-30): rows that sum up other rows (OWID's "World", "Europe", "High-income
# countries"; a "Total" row). `code_prefixes`: codes given to such rows ("OWID_WRL"). `words`:
# whole words of a label that say "every row" on their own. `group_words`: words of a group of
# rows ("South Africa" is a country), only counted when the label has no code while the others do.
[aggregates]
code_prefixes = ["owid_"]
words = [
  "world", "total", "totals", "all", "global", "overall", "worldwide", "subtotal",
  "monde", "ensemble", "tous", "toutes", "mondial", "mundo", "todos", "todas", "gesamt",
  "insgesamt", "welt", "totale", "tutti",
]
group_words = [
  "income", "countries", "regions", "union", "excl", "oecd", "continent", "members",
  "africa", "asia", "europe", "oceania", "america", "americas", "caribbean", "antarctica",
  "afrique", "asie", "amerique", "oceanie", "pays", "zone", "middle", "east", "saharan",
  "latin", "pacific", "arab", "euro", "area", "developed", "developing",
]

