# Kinds of datasets and their KPI packs (061, P17, R-ARC-01 and R-ARC-02).
#
# A kind fits when every group of `needs` is met by one column: `role:x` is a column given that
# role, `word:x` a column whose name holds that whole word. `signals` are further clues, each met
# once; at least `min_signals` are needed. The kind with the most clues wins (file order on a tie).
# Its pack is the suggested KPIs made by `rules`, in that order, 5 at most and 3 at least.
# Nothing is applied on its own: the app says "Looks like sales data · 5 KPIs" and the user
# confirms before any KPI is saved.

[[archetype]]
id = "sales"
label = "sales data"
needs = [
  ["role:amount", "role:unit_price"],
  ["role:order_key", "role:quantity", "word:sales", "word:revenue", "word:invoice"],
]
signals = [
  "role:customer_key", "role:cost", "role:unit_price", "role:quantity", "role:order_key",
  "role:currency", "word:product", "word:discount", "word:profit", "word:invoice", "word:sales",
  "word:revenue", "word:order", "word:sku", "word:store",
]
min_signals = 1
rules = ["R-SUG-02", "R-SUG-31", "R-SUG-12", "R-SUG-11", "R-SUG-20", "R-SUG-21", "R-SUG-10",
         "R-SUG-14", "R-SUG-13", "R-SUG-15", "R-SUG-03"]

