[project]
name = "quantilo"
version = "0.1.0"
description = "Quantilo, a data analysis library: exploratory data analysis with statistical depth, in Python (the engine of the Quantilo app)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cyril Kfouri" }]
keywords = ["data analysis", "eda", "statistics", "profiling", "time series", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.5.6",
    # Public holidays by country, a calendar driver of the forecast (028 A5); pure Python.
    "holidays>=0.108",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    # Decoding, EXIF orientation, resizing and WebP thumbnails of image sets (103).
    "pillow>=11",
    "pyarrow>=26.0.0",
    "pydantic>=2.14",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/CyrilKFOURI/quantilo"
App = "https://quantilo-app.vercel.app"
Source = "https://github.com/CyrilKFOURI/quantilo/tree/master/packages/quantilo"

[project.optional-dependencies]
# Boosting models and hyper-parameter tuning (019, 021).
ml = [
    "cmaes>=0.13.1",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "xgboost>=3 ; sys_platform != 'linux'",
    "xgboost-cpu>=3 ; sys_platform == 'linux'",
]
# Deep synthetic-data models (023b: CTGAN, TVAE, TimeGAN).
deep = ["torch>=2.14"]
# The app's charts as interactive figures (dx.plot).
plot = ["plotly>=6"]
# Sentence embeddings for free text (091): a static model (potion-multilingual-128M, MIT, about
# 0.5 GB of weights, downloaded on confirmation), CPU only, no torch. Not in the browser version.
embed = ["model2vec>=0.6"]
# Deep vision (114): frozen DINOv2 / ResNet backbones, linear probe and kNN. Weights are not in the
# packages: downloaded once on confirmation (sizes and SHA-256 in quantilo/vision/deep/weights.py).
vision = [
    "huggingface-hub>=1",
    "safetensors>=0.5",
    "timm>=1.0.20",
    "torch>=2.14",
    "torchvision>=0.29",
]
# AI forecasting models (028 phase B): Chronos-Bolt and Chronos-2 (chronos-forecasting, Apache-2.0;
# transformers, accelerate, einops), TimesFM 2.5 (timesfm, Apache-2.0), N-HiTS / N-BEATS written
# in torch. Weights are not in the packages: downloaded once on confirmation into <home>/models
# (revisions, sizes and SHA-256 in quantilo/timeseries/ai.py). Not in the browser version.
forecast-ai = [
    "chronos-forecasting>=2.3.2",
    "timesfm>=3.0.2",
    "torch>=2.14",
]
# Models readable by construction (122), loaded lazily and greyed with their reason when absent
# (quantilo/interpret/extras.py): GOSDT's optimal sparse trees (BSD-3, wheels for Python 3.9 to
# 3.12 only), TreeFARMS's Rashomon set (BSD-3; gmpy2, timbertrek, matplotlib), PaCMAP (Apache-2.0;
# numba, faiss-cpu, about 100 MB) and TriMAP (Apache-2.0; annoy, numba). Not in Pyodide.
interpret = [
    "gosdt>=1.0 ; python_version < '3.13'",
    "pacmap>=0.7",
    "treefarms>=0.2 ; sys_platform != 'win32'",  # its Windows wheel links python37.dll
    "trimap>=1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# PyTorch: built for CUDA 13.0 on Windows (driver >= 580), CPU-only on Linux (CI, small), the
# default wheels on macOS (Apple GPU through MPS). Same choice as the app.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
# torchvision is built against one torch: same index as torch, or its C++ operators break.
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantilo"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The README's examples keep their aligned comments; notebooks are demos with long lines.
extend-exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Statistical notation (×, ρ, η², en dashes) is intended in these messages.
# Benjamini–Hochberg, Welch–Satterthwaite, α and σ in the inference texts (051).
"src/quantilo/compare/*" = ["RUF001", "RUF002", "RUF003"]
# Bands written 2–4, sizes 250 × 20,000 and Advanced › More in the Expert checks (101).
"src/quantilo/cleaning/expert/*" = ["RUF001", "RUF002", "RUF003"]
# Check-digit formulas written (12 + 3 × (SIREN mod 97)) mod 97 (audit 2026-11-12, N21).
"src/quantilo/cleaning/rules/formats.py" = ["RUF001", "RUF002", "RUF003"]
# Fellegi–Sunter in the entity clusters' reasons (audit 2026-11-12, N36).
"src/quantilo/cleaning/rules/entities.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_inference.py" = ["RUF001", "RUF003"]
"tests/test_correlations.py" = ["RUF001"]
"src/quantilo/changes/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_changes.py" = ["RUF003"]
"src/quantilo/correlations/*" = ["RUF001", "RUF003"]
"src/quantilo/report/*" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/dataset.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/forecast.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/facade.py" = ["RUF002"]
# AI forecasting (028 phase B): Settings › Models, z(0.975) / z(0.9), 4 × h in texts and comments.
"src/quantilo/timeseries/ai.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/pretrained.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/neural.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_forecast_ai.py" = ["RUF001", "RUF002", "RUF003"]
# Matrix notation (nodes × steps, S′W⁻¹S) in the reconciliation and group forecasts (039).
"src/quantilo/timeseries/hierarchy.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/groups.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/global_model.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/experiments/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_experiments.py" = ["RUF001", "RUF003"]
# Segment portraits and reasons speak with the same symbols (2.1×, γ, ≤, −1).
"src/quantilo/segments/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_segments.py" = ["RUF001", "RUF002", "RUF003"]
# Chart labels and hover texts use the app's symbols (×, −, σ, ρ, η, ≤).
"src/quantilo/plots/*" = ["RUF001", "RUF002", "RUF003"]
# Extreme-value notation (ξ, σ, ζ, ×, −) in the tail and robust analyses (056).
"src/quantilo/variable/tails.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/variable/robust.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tails.py" = ["RUF001", "RUF002", "RUF003"]
# Regression sentences and notation (×, −, ρ, Breusch–Pagan, ⌊4(T/100)^(2/9)⌋) (067).
"src/quantilo/regression/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_regression*.py" = ["RUF001", "RUF002", "RUF003"]
# Table detection (080): header names join levels with " · ", labels carry dashes and NBSP.
"src/quantilo/ingestion/layout/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_layout_*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/layout_fixtures.py" = ["RUF001", "RUF002", "RUF003"]
# Image sizes and orientations are written 640 × 480 and "rotated 90° clockwise" (084).
"src/quantilo/ingestion/images.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_images.py" = ["RUF001", "RUF002", "RUF003"]
# The One table factor (×4.7) and arrows in the structured reader's reasons (083).
"src/quantilo/ingestion/structured/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_structured*.py" = ["RUF001", "RUF002", "RUF003"]
# Advanced cleaning reasons speak in formulas and ranges (total = a × b + c, ÷100, 0–1) (097).
"src/quantilo/cleaning/rules/advanced.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_cleaning_advanced.py" = ["RUF001", "RUF002", "RUF003"]
# B1: the other Advanced rules speak the same way (3 × IQR, 40 – 120, Add step › Change type).
"src/quantilo/cleaning/rules/distributions.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/cleaning/rules/linkage.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/cleaning/rules/shapes.py" = ["RUF001", "RUF002", "RUF003"]
# Deep vision (114): ‖ (concatenation), ≈ (estimates), × (sizes) in docstrings and sentences.
"src/quantilo/vision/deep/*" = ["RUF001", "RUF002", "RUF003"]
# Readable models (121, 122): conditions and cards read "x ≤ t", "−5 to 5", "σ(a + b·total)".
"src/quantilo/interpret/*" = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: performance checks on millions of rows (run with -m slow)",
  "clean_bench: the cleaning precision bench on the committed corpus (N01, -m clean_bench)",
]
addopts = "-m 'not slow'"
