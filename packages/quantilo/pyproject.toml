[project]
name = "quantilo"
version = "0.1.0"
description = "Quantilo, a data analysis library: exploratory data analysis with statistical depth, in Python (the engine of the Quantilo app)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cyril Kfouri" }]
keywords = ["data analysis", "eda", "statistics", "profiling", "time series", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.5.6",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    # Decoding, EXIF orientation, resizing and WebP thumbnails of image sets (103).
    "pillow>=11",
    "pyarrow>=26.0.0",
    "pydantic>=2.14",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/CyrilKFOURI/quantilo"
App = "https://quantilo-app.vercel.app"
Source = "https://github.com/CyrilKFOURI/quantilo/tree/master/packages/quantilo"

[project.optional-dependencies]
# Boosting models and hyper-parameter tuning (019, 021).
ml = [
    "cmaes>=0.13.1",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "xgboost>=3 ; sys_platform != 'linux'",
    "xgboost-cpu>=3 ; sys_platform == 'linux'",
]
# Deep synthetic-data models (023b: CTGAN, TVAE, TimeGAN).
deep = ["torch>=2.14"]
# The app's charts as interactive figures (dx.plot).
plot = ["plotly>=6"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# PyTorch: built for CUDA 13.0 on Windows (driver >= 580), CPU-only on Linux (CI, small), the
# default wheels on macOS (Apple GPU through MPS). Same choice as the app.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantilo"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The README's examples keep their aligned comments; notebooks are demos with long lines.
extend-exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Statistical notation (×, ρ, η², en dashes) is intended in these messages.
# Benjamini–Hochberg, Welch–Satterthwaite, α and σ in the inference texts (051).
"src/quantilo/compare/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_inference.py" = ["RUF001", "RUF003"]
"tests/test_correlations.py" = ["RUF001"]
"src/quantilo/changes/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_changes.py" = ["RUF003"]
"src/quantilo/correlations/*" = ["RUF001", "RUF003"]
"src/quantilo/report/*" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/dataset.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/forecast.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/facade.py" = ["RUF002"]
# Matrix notation (nodes × steps, S′W⁻¹S) in the reconciliation and group forecasts (039).
"src/quantilo/timeseries/hierarchy.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/groups.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/timeseries/global_model.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/experiments/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_experiments.py" = ["RUF001", "RUF003"]
# Segment portraits and reasons speak with the same symbols (2.1×, γ, ≤, −1).
"src/quantilo/segments/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_segments.py" = ["RUF001", "RUF002", "RUF003"]
# Chart labels and hover texts use the app's symbols (×, −, σ, ρ, η, ≤).
"src/quantilo/plots/*" = ["RUF001", "RUF002", "RUF003"]
# Extreme-value notation (ξ, σ, ζ, ×, −) in the tail and robust analyses (056).
"src/quantilo/variable/tails.py" = ["RUF001", "RUF002", "RUF003"]
"src/quantilo/variable/robust.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tails.py" = ["RUF001", "RUF002", "RUF003"]
# Regression sentences and notation (×, −, ρ, Breusch–Pagan, ⌊4(T/100)^(2/9)⌋) (067).
"src/quantilo/regression/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_regression*.py" = ["RUF001", "RUF002", "RUF003"]
# Table detection (080): header names join levels with " · ", labels carry dashes and NBSP.
"src/quantilo/ingestion/layout/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_layout_*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/layout_fixtures.py" = ["RUF001", "RUF002", "RUF003"]
# Image sizes and orientations are written 640 × 480 and "rotated 90° clockwise" (084).
"src/quantilo/ingestion/images.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_images.py" = ["RUF001", "RUF002", "RUF003"]
# The One table factor (×4.7) and arrows in the structured reader's reasons (083).
"src/quantilo/ingestion/structured/*" = ["RUF001", "RUF002", "RUF003"]
"tests/test_structured*.py" = ["RUF001", "RUF002", "RUF003"]
# Advanced cleaning reasons speak in formulas and ranges (total = a × b + c, ÷100, 0–1) (097).
"src/quantilo/cleaning/rules/advanced.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_cleaning_advanced.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance checks on millions of rows (run with -m slow)"]
addopts = "-m 'not slow'"
