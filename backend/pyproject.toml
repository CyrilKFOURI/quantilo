[project]
name = "quantilo-app"
version = "0.1.0"
description = "Quantilo, a data analysis app: local, offline exploratory data analysis with statistical depth."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # The engine: every calculation, shared with notebooks and scripts (packages/).
    "quantilo[ml]",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Deep synthetic-data models (023b: CTGAN, TVAE, TimeGAN). Not in the default Docker image.
deep = ["quantilo[deep]", "torch>=2.14"]
# AI agent (026): the official Anthropic SDK (Claude) and OpenAI SDK (OpenAI and every
# OpenAI-compatible API: Gemini, Mistral, Groq, OpenRouter, local models). Optional.
agent = ["anthropic>=2", "openai>=3"]
# Deep vision (114): frozen DINOv2 / ResNet backbones, linear probe and kNN (torch, torchvision,
# timm). Not in the default Docker image: docker build --build-arg QUANTILO_EXTRAS="agent vision".
vision = ["quantilo[vision]"]
# AI forecasting models (028 phase B): Chronos-Bolt, Chronos-2, TimesFM 2.5, N-HiTS / N-BEATS.
# Optional and heavy (torch); weights downloaded on confirmation into <home>/models.
# Docker: docker build --build-arg QUANTILO_EXTRAS="agent forecast-ai".
forecast-ai = ["quantilo[forecast-ai]"]
# Readable models (122): GOSDT, TreeFARMS, PaCMAP, TriMAP. Optional and heavy; gosdt has no wheel
# for Python 3.13 (its options stay greyed with that reason in a 3.13 environment).
interpret = ["quantilo[interpret]"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# PyTorch: built for CUDA 13.0 on Windows (driver >= 580), CPU-only on Linux (CI, small), the
# default wheels on macOS (Apple GPU through MPS).
[tool.uv.sources]
quantilo = { path = "../packages/quantilo", editable = true }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
# torchvision is built against one torch: same index as torch, or its C++ operators break.
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Statistical notation (×, ρ, η², en dashes) is intended in these messages.
"app/modules/agent/**" = ["RUF001", "RUF002", "RUF003"]
"app/core/tools.py" = ["RUF002", "RUF003"]
"app/modules/*/agent_tools.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance checks on millions of rows (run with -m slow)"]
addopts = "-m 'not slow'"
